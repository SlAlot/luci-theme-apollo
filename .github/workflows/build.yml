name: Check and build packages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: npm ci --prefix tests --ignore-scripts
      - run: node tests/validate.cjs
      - run: git diff --check
  package:
    needs: validate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        sdk: [x86_64-23.05.5, x86_64-24.10.5, x86_64-25.12.0]
    steps:
      - uses: actions/checkout@v4
      - name: Prepare SDK feed layout
        run: |
          mkdir -p "$RUNNER_TEMP/feed/luci-theme-apollo"
          cp -a Makefile LICENSE LICENSES root "$RUNNER_TEMP/feed/luci-theme-apollo/"
      - name: Build standard architecture-independent OpenWrt package
        timeout-minutes: 20
        env:
          SDK_TAG: ${{ matrix.sdk }}
          PACKAGES: luci-theme-apollo
        run: |
          entrypoint="$RUNNER_TEMP/sdk-entrypoint.sh"
          output="$RUNNER_TEMP/sdk-output"
          mkdir -p "$output"
          sudo chown 1000:1000 "$output"
          curl -fsSL --retry 3 -o "$entrypoint" \
            https://raw.githubusercontent.com/openwrt/gh-action-sdk/f5813d30eeef3534b58ac7e79c5d8842b6035434/entrypoint.sh
          upstream=https://downloads.openwrt.org
          if [ "$SDK_TAG" != x86_64-23.05.5 ]; then
            mirror="$RUNNER_TEMP/sdk-mirror"
            python3 tests/fetch-sdk.py "${SDK_TAG#x86_64-}" "$mirror"
            python3 -m http.server 18765 --bind 127.0.0.1 --directory "$mirror" >/dev/null 2>&1 &
            server=$!
            trap 'kill "$server"' EXIT
            upstream=http://127.0.0.1:18765
            for attempt in 1 2 3 4 5; do
              curl -fsS "$upstream/" -o /dev/null && break
              sleep 1
            done
          fi
          status=0
          docker run --rm --network host --entrypoint /bin/bash \
            -e FILE_HOST="$upstream" -e UPSTREAM_URL="$upstream" \
            -e PACKAGES -e FEEDNAME=panel -e V=s \
            -v "$RUNNER_TEMP/feed:/feed:ro" -v "$output:/artifacts" \
            -v "$entrypoint:/sdk-entrypoint.sh:ro" \
            "ghcr.io/openwrt/sdk:$SDK_TAG" /sdk-entrypoint.sh || status=$?
          sudo chown -R "$(id -u):$(id -g)" "$output"
          cp -a "$output/." .
          exit "$status"
      - name: Verify package was produced
        run: |
          find bin -type f \( -name 'luci-theme-apollo*.ipk' -o -name 'luci-theme-apollo*.apk' \) > package-files.txt
          test -s package-files.txt
      - uses: actions/upload-artifact@v4
        with:
          name: luci-theme-apollo-${{ matrix.sdk }}
          path: |
            bin/packages/**/luci-theme-apollo*.ipk
            bin/packages/**/luci-theme-apollo*.apk
          if-no-files-found: error
      - name: Install and start stock LuCI
        run: bash tests/openwrt-smoke.sh ${{ matrix.sdk }} "$(head -n 1 package-files.txt)"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: logs-${{ matrix.sdk }}
          path: logs/
          if-no-files-found: ignore
